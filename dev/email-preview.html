<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Email preview — Minnow (dev)</title>
<script>
  // Minimal theme boot for the harness. Reads ?theme= (default swamp-dark) so
  // each scene URL renders in a fixed palette without the app's storage layer.
  (function () {
    var params = new URLSearchParams(location.search);
    var id = params.get('theme') || 'swamp-dark';
    if (!/^(swamp|desert|ocean|coral|mono|matrix|human|mint)-(dark|light)$/.test(id)) id = 'swamp-dark';
    var mode = id.indexOf('-light') > 0 ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', id);
    document.documentElement.style.colorScheme = mode;
  })();
</script>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--mn-bg, #0f1216);
    color: var(--mn-fg, #dfe3e8);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
  }
  /* The stage fills the viewport so responsive media queries evaluate against
     the real window width. Resize the browser to test breakpoints. */
  #stage { height: 100vh; height: 100dvh; display: flex; flex-direction: column; min-height: 0; }
  #stage > * { flex: 1; min-height: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./email-preview.ts"></script>
</body>
</html>
