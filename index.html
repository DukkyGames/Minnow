<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00d4ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LMChat">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>LM Studio Chat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Rajdhani:wght@300;400;500;600;700&display=swap');

:root {
  --bg:        #0a0b0d;
  --surface:   #111318;
  --surface2:  #161920;
  --border:    #1e2230;
  --border2:   #2a3045;
  --cyan:      #00d4ff;
  --cyan-dim:  rgba(0,212,255,0.10);
  --cyan-glow: rgba(0,212,255,0.22);
  --green:     #39ff7a;
  --yellow:    #ffd166;
  --red:       #ff4d6a;
  --muted:     #4a5270;
  --text:      #c8d0e8;
  --text-dim:  #6b7494;
  --user-bg:   rgba(0,212,255,0.07);
  --user-bdr:  rgba(0,212,255,0.18);
  --asst-bg:   rgba(255,255,255,0.03);
  --asst-bdr:  #1e2230;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  display: flex;
  flex-direction: column;
}

/* scanlines */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);
  pointer-events: none;
  z-index: 200;
}

/* ─── TOPBAR ─── */
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  height: 48px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  z-index: 10;
}

.logo-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
  animation: blink 2.4s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

.app-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .14em;
  color: var(--cyan);
  text-transform: uppercase;
  white-space: nowrap;
}

.topbar-sep { width: 1px; height: 20px; background: var(--border2); margin: 0 4px; flex-shrink: 0; }

/* Model picker in topbar */
.model-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
  max-width: 340px;
}

.model-wrap select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 5px 28px 5px 10px;
  outline: none;
  appearance: none;
  cursor: pointer;
  transition: border-color .15s;
  overflow: hidden;
  text-overflow: ellipsis;
}

.model-wrap select:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px var(--cyan-dim); }
.model-wrap select option { background: #1a1d27; }

.model-wrap::after {
  content: '▾';
  position: absolute;
  right: 9px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
  font-size: 10px;
}

.icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
  transition: all .15s;
  flex-shrink: 0;
}
.icon-btn:hover { border-color: var(--cyan); color: var(--cyan); }

.status-pill {
  display: flex; align-items: center; gap: 6px;
  margin-left: auto;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: .04em;
  white-space: nowrap;
  flex-shrink: 0;
}

.s-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  transition: background .3s;
}
.s-dot.ok  { background: var(--green); box-shadow: 0 0 6px var(--green); }
.s-dot.err { background: var(--red);   box-shadow: 0 0 6px var(--red); }
.s-dot.spin{ background: var(--cyan);  animation: blink .7s ease-in-out infinite; }

/* ─── SETTINGS DRAWER ─── */
.drawer-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 50;
}
.drawer-overlay.open { display: block; }

.drawer {
  position: fixed;
  top: 48px; right: 0; bottom: 0;
  width: 280px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform .22s cubic-bezier(.4,0,.2,1);
  z-index: 51;
}
.drawer.open { transform: translateX(0); }

.drawer-header {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-family: 'Rajdhani', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--text-dim);
  flex-shrink: 0;
}

.drawer-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
  flex: 1;
}

.field { display: flex; flex-direction: column; gap: 5px; }

.field label {
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.field input, .field textarea, .field select {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 7px 10px;
  outline: none;
  transition: border-color .15s;
  width: 100%;
}

.field input:focus, .field textarea:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px var(--cyan-dim);
}

.field textarea { resize: vertical; min-height: 70px; line-height: 1.6; }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.drawer-clear-btn {
  margin-top: auto;
  padding: 8px;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: 3px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: .06em;
  cursor: pointer;
  transition: all .15s;
  flex-shrink: 0;
}
.drawer-clear-btn:hover { border-color: var(--red); color: var(--red); }

/* ─── CHAT AREA ─── */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* Empty state */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .05em;
  text-align: center;
  padding: 40px;
}

.empty-icon {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  margin-bottom: 4px;
  color: var(--border2);
}

/* Messages */
.msg {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 820px;
  width: 100%;
  animation: fadeUp .2s ease-out;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.assistant { align-self: flex-start; align-items: flex-start; }

.msg-label {
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 0 4px;
}

.msg-bubble {
  padding: 11px 14px;
  border-radius: 4px;
  line-height: 1.7;
  font-size: 13px;
  white-space: pre-wrap;
  word-break: break-word;
  max-width: 100%;
}

.msg.user .msg-bubble {
  background: var(--user-bg);
  border: 1px solid var(--user-bdr);
  color: var(--text);
}

.msg.assistant .msg-bubble {
  background: var(--asst-bg);
  border: 1px solid var(--asst-bdr);
  color: var(--text);
}

/* Streaming cursor */
.cursor {
  display: inline-block;
  width: 8px; height: 14px;
  background: var(--cyan);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: cursor-blink .8s step-end infinite;
}

@keyframes cursor-blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Stats pill under assistant message */
.msg-stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  padding: 0 4px;
}

.stat-chip {
  font-size: 9px;
  letter-spacing: .06em;
  padding: 2px 7px;
  border-radius: 2px;
  border: 1px solid var(--border2);
  color: var(--text-dim);
  white-space: nowrap;
}

.stat-chip span { font-weight: 700; }
.stat-chip.c { color: var(--cyan);   border-color: rgba(0,212,255,.2); }
.stat-chip.g { color: var(--green);  border-color: rgba(57,255,122,.2); }
.stat-chip.y { color: var(--yellow); border-color: rgba(255,209,102,.2); }
.stat-chip.r { color: var(--red);    border-color: rgba(255,77,106,.2); }

/* ─── INPUT BAR ─── */
.input-bar {
  border-top: 1px solid var(--border);
  background: var(--surface);
  padding: 12px 16px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
}

.input-wrap {
  flex: 1;
  position: relative;
}

#msgInput {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 10px 14px;
  outline: none;
  resize: none;
  line-height: 1.6;
  min-height: 42px;
  max-height: 160px;
  overflow-y: auto;
  transition: border-color .15s;
  display: block;
}

#msgInput:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px var(--cyan-dim);
}

#msgInput::placeholder { color: var(--muted); }

.send-btn {
  display: flex; align-items: center; justify-content: center;
  width: 42px; height: 42px;
  background: var(--cyan-dim);
  border: 1px solid var(--cyan);
  border-radius: 4px;
  color: var(--cyan);
  font-size: 16px;
  cursor: pointer;
  transition: all .15s;
  flex-shrink: 0;
}

.send-btn:hover:not(:disabled) {
  background: var(--cyan-glow);
  box-shadow: 0 0 14px var(--cyan-dim);
}

.send-btn:disabled { opacity: .35; cursor: not-allowed; }

.spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--border2);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin .6s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.hidden { display: none !important; }

/* ─── STATS STRIP ─── */
.stats-strip {
  border-top: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr) 2fr 1fr;
}

.stat-cell {
  padding: 10px 14px;
  border-right: 1px solid var(--border);
  position: relative;
}

.stat-cell::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}

.stat-cell.cyan::before   { background: var(--cyan); }
.stat-cell.green::before  { background: var(--green); }
.stat-cell.yellow::before { background: var(--yellow); }
.stat-cell.red::before    { background: var(--red); }
.stat-cell:last-child { border-right: none; }

.stat-name {
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.stat-val {
  font-size: 19px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.stat-cell.cyan   .stat-val { color: var(--cyan); }
.stat-cell.green  .stat-val { color: var(--green); }
.stat-cell.yellow .stat-val { color: var(--yellow); }
.stat-cell.red    .stat-val { color: var(--red); }
.stat-val.blank { color: var(--border2) !important; }

.stat-unit { font-size: 10px; color: var(--text-dim); margin-left: 2px; }

.token-cell {
  padding: 9px 14px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
}

.token-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
}

.tbl { width: 66px; color: var(--text-dim); flex-shrink: 0; }

.token-track {
  flex: 1; height: 5px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.token-fill {
  height: 100%; border-radius: 2px; width: 0%;
  transition: width .6s cubic-bezier(.4,0,.2,1);
}

.token-fill.prompt     { background: var(--cyan); }
.token-fill.completion { background: var(--green); }

.token-count {
  width: 32px; text-align: right;
  color: var(--text); font-variant-numeric: tabular-nums; flex-shrink: 0;
}

.minfo-cell {
  padding: 9px 12px;
  display: flex; flex-direction: column;
  justify-content: center; gap: 3px; font-size: 10px;
}

.irow { display: flex; gap: 5px; align-items: baseline; }
.ikey { color: var(--text-dim); flex-shrink: 0; }
.ival { color: var(--text-dim); }
.ival.lit { color: var(--cyan); }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="logo-dot"></div>
  <div class="app-title">LMChat</div>
  <div class="topbar-sep"></div>

  <div class="model-wrap">
    <select id="modelSelect" title="Select model"></select>
  </div>

  <button class="icon-btn" title="Refresh models" onclick="fetchModels()">↻</button>
  <button class="icon-btn" title="Settings" onclick="toggleDrawer()">⚙</button>

  <div class="status-pill">
    <div class="s-dot" id="sDot"></div>
    <span id="sText">Connecting…</span>
  </div>
</div>

<!-- Settings drawer -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">⚙ Settings</div>
  <div class="drawer-body">
    <div class="field">
      <label>Server URL</label>
      <input type="text" id="serverUrl" value="http://localhost:1234" onchange="fetchModels()">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Temperature</label>
        <input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1">
      </div>
      <div class="field">
        <label>Max Tokens</label>
        <input type="number" id="maxTokens" value="512" min="1" max="8192">
      </div>
    </div>
    <div class="field">
      <label>System Prompt</label>
      <textarea id="systemPrompt" placeholder="You are a helpful assistant." rows="5"></textarea>
    </div>
    <button class="drawer-clear-btn" onclick="clearChat()">✕ Clear conversation</button>
  </div>
</div>

<!-- Chat messages -->
<div class="chat-area" id="chatArea">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">◎</div>
    <div>Connect to LM Studio and start chatting</div>
    <div style="color:var(--border2); font-size:10px;">localhost:1234 · /api/v0/chat/completions</div>
  </div>
</div>

<!-- Input bar -->
<div class="input-bar">
  <div class="input-wrap">
    <textarea id="msgInput" placeholder="Message…" rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send (Enter)">
    <span id="sendIcon">▶</span>
    <span id="sendSpinner" class="spinner hidden"></span>
  </button>
</div>

<!-- Stats strip -->
<div class="stats-strip">
  <div class="stat-cell cyan">
    <div class="stat-name">Tokens / Second</div>
    <div class="stat-val blank" id="stripTPS">—</div>
  </div>
  <div class="stat-cell green">
    <div class="stat-name">Time to First Token</div>
    <div class="stat-val blank" id="stripTTFT">—</div>
  </div>
  <div class="stat-cell yellow">
    <div class="stat-name">Generation Time</div>
    <div class="stat-val blank" id="stripGen">—</div>
  </div>
  <div class="stat-cell red">
    <div class="stat-name">Total Tokens</div>
    <div class="stat-val blank" id="stripTotal">—</div>
  </div>
  <div class="token-cell">
    <div class="token-bar-row">
      <span class="tbl">Prompt</span>
      <div class="token-track"><div class="token-fill prompt" id="barPrompt"></div></div>
      <span class="token-count" id="cntPrompt">—</span>
    </div>
    <div class="token-bar-row">
      <span class="tbl">Completion</span>
      <div class="token-track"><div class="token-fill completion" id="barCompletion"></div></div>
      <span class="token-count" id="cntCompletion">—</span>
    </div>
  </div>
  <div class="minfo-cell">
    <div class="irow"><span class="ikey">arch</span><span class="ival" id="iArch">—</span></div>
    <div class="irow"><span class="ikey">quant</span><span class="ival" id="iQuant">—</span></div>
    <div class="irow"><span class="ikey">ctx</span><span class="ival" id="iCtx">—</span></div>
    <div class="irow"><span class="ikey">stop</span><span class="ival lit" id="iStop">—</span></div>
  </div>
</div>

<script>
// ── State ──
const history = []; // {role, content}
let streaming = false;

// ── PWA service worker ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ── Helpers ──
function serverUrl() {
  return document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
}

function setStatus(state, msg) {
  document.getElementById('sDot').className = `s-dot ${state}`;
  document.getElementById('sText').textContent = msg;
}

function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('drawerOverlay').classList.toggle('open');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function scrollBottom() {
  const area = document.getElementById('chatArea');
  area.scrollTop = area.scrollHeight;
}

function clearChat() {
  history.length = 0;
  const area = document.getElementById('chatArea');
  area.innerHTML = '';
  area.appendChild(Object.assign(document.createElement('div'), {
    className: 'empty-state',
    id: 'emptyState',
    innerHTML: '<div class="empty-icon">◎</div><div>Conversation cleared</div>'
  }));
  closeDrawer();
}

// ── Model fetching ──
async function fetchModels() {
  const sel = document.getElementById('modelSelect');
  sel.innerHTML = '<option value="">Loading…</option>';
  setStatus('spin', 'Connecting…');
  try {
    const res = await fetch(`${serverUrl()}/api/v0/models`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const models = (data.data || []).filter(m => m.type === 'llm' || m.type === 'vlm');

    if (!models.length) {
      sel.innerHTML = '<option value="">No LLMs found</option>';
      setStatus('err', 'No models');
      return;
    }

    sel.innerHTML = models.map(m => {
      const loaded = m.state === 'loaded';
      const tag = m.quantization ? ` · ${m.quantization}` : '';
      return `<option value="${m.id}">${loaded ? '● ' : '○ '}${m.id}${tag}</option>`;
    }).join('');

    const loadedIdx = models.findIndex(m => m.state === 'loaded');
    if (loadedIdx >= 0) sel.selectedIndex = loadedIdx;

    const nLoaded = models.filter(m => m.state === 'loaded').length;
    setStatus('ok', `${models.length} models · ${nLoaded} loaded`);
  } catch (err) {
    sel.innerHTML = '<option value="">Unreachable</option>';
    setStatus('err', 'Server unreachable');
  }
}

// ── Append message bubble ──
function appendBubble(role, content) {
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();

  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : 'Assistant';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = content;

  wrap.appendChild(label);
  wrap.appendChild(bubble);
  document.getElementById('chatArea').appendChild(wrap);
  scrollBottom();
  return { wrap, bubble };
}

// ── Add stats chips under a message ──
function appendStats(wrap, stats, usage) {
  const s = stats || {};
  const u = usage || {};

  const chips = document.createElement('div');
  chips.className = 'msg-stats';

  const defs = [
    ['c', s.tokens_per_second != null, `<span>${s.tokens_per_second?.toFixed(1)}</span> tok/s`],
    ['g', s.time_to_first_token != null, `TTFT <span>${s.time_to_first_token?.toFixed(3)}s</span>`],
    ['y', s.generation_time != null, `gen <span>${s.generation_time?.toFixed(3)}s</span>`],
    ['r', u.total_tokens != null, `<span>${u.total_tokens}</span> tokens`],
  ];

  defs.forEach(([cls, show, html]) => {
    if (!show) return;
    const chip = document.createElement('div');
    chip.className = `stat-chip ${cls}`;
    chip.innerHTML = html;
    chips.appendChild(chip);
  });

  if (chips.children.length) wrap.appendChild(chips);
}

// ── Send message ──
async function sendMessage() {
  if (streaming) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  const modelId   = document.getElementById('modelSelect').value;
  const temp      = parseFloat(document.getElementById('temperature').value);
  const maxTok    = parseInt(document.getElementById('maxTokens').value);
  const sysPrompt = document.getElementById('systemPrompt').value.trim();

  // Add to history and UI
  history.push({ role: 'user', content: text });
  appendBubble('user', text);

  // Clear input
  input.value = '';
  input.style.height = 'auto';

  // Build message array
  const messages = [];
  if (sysPrompt) messages.push({ role: 'system', content: sysPrompt });
  messages.push(...history);

  const body = {
    model: modelId || undefined,
    messages,
    temperature: temp,
    max_tokens: maxTok,
    stream: true
  };

  // Assistant bubble
  const { wrap, bubble } = appendBubble('assistant', '');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  bubble.appendChild(cursor);

  streaming = true;
  setSendLoading(true);
  setStatus('spin', 'Generating…');

  let fullText = '';
  let lastData = null;

  try {
    const res = await fetch(`${serverUrl()}/api/v0/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`HTTP ${res.status}: ${err}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // keep incomplete line

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === '[DONE]') continue;

        try {
          const chunk = JSON.parse(payload);
          // Capture last chunk for stats (non-streaming endpoints send one big chunk)
          lastData = chunk;
          const delta = chunk.choices?.[0]?.delta?.content
                     ?? chunk.choices?.[0]?.message?.content
                     ?? '';
          if (delta) {
            fullText += delta;
            bubble.textContent = fullText;
            bubble.appendChild(cursor);
            scrollBottom();
          }
        } catch (_) {}
      }
    }

    cursor.remove();

    // If streaming yielded nothing, fall back to non-streaming
    if (!fullText) {
      bubble.textContent = '';
      const fallback = await tryNonStreamingFallback(serverUrl(), { model: modelId || undefined, messages, temperature: temp, max_tokens: maxTok });
      fullText = fallback.choices?.[0]?.message?.content ?? '';
      lastData = fallback;
      bubble.textContent = fullText || '(empty response)';
    }

    if (fullText) {
      history.push({ role: 'assistant', content: fullText });
      if (lastData) {
        appendStats(wrap, lastData.stats, lastData.usage);
        updateStrip(lastData.stats, lastData.usage, lastData.model_info);
      }
      setStatus('ok', modelId || 'done');
    }

  } catch (err) {
    cursor.remove();
    bubble.textContent = `Error: ${err.message}`;
    bubble.style.color = 'var(--red)';
    setStatus('err', err.message.slice(0, 40));
  } finally {
    streaming = false;
    setSendLoading(false);
    scrollBottom();
  }
}

// Handle non-streaming response body (LM Studio sometimes returns full JSON even with stream:true)
// Override fetch to also attempt plain JSON parse if SSE yields nothing
async function tryNonStreamingFallback(serverUrl, body) {
  const res = await fetch(`${serverUrl}/api/v0/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, stream: false })
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}


// ── Update persistent stats strip ──
function updateStrip(stats, usage, modelInfo) {
  const s = stats || {};
  const u = usage || {};
  const m = modelInfo || {};

  function set(id, html, blank) {
    const el = document.getElementById(id);
    el.innerHTML = html;
    el.classList.toggle('blank', !!blank);
  }

  set('stripTPS',
    s.tokens_per_second != null
      ? s.tokens_per_second.toFixed(1)
      : '—',
    s.tokens_per_second == null);

  set('stripTTFT',
    s.time_to_first_token != null
      ? `${s.time_to_first_token.toFixed(3)}<span class="stat-unit">s</span>`
      : '—',
    s.time_to_first_token == null);

  set('stripGen',
    s.generation_time != null
      ? `${s.generation_time.toFixed(3)}<span class="stat-unit">s</span>`
      : '—',
    s.generation_time == null);

  set('stripTotal', u.total_tokens ?? '—', u.total_tokens == null);

  const p = u.prompt_tokens ?? 0;
  const c = u.completion_tokens ?? 0;
  const t = p + c || 1;
  document.getElementById('barPrompt').style.width     = `${(p/t*100).toFixed(1)}%`;
  document.getElementById('barCompletion').style.width = `${(c/t*100).toFixed(1)}%`;
  document.getElementById('cntPrompt').textContent     = p || '—';
  document.getElementById('cntCompletion').textContent = c || '—';

  document.getElementById('iArch').textContent  = m.arch           ?? '—';
  document.getElementById('iQuant').textContent = m.quant          ?? '—';
  document.getElementById('iCtx').textContent   = m.context_length ?? '—';
  document.getElementById('iStop').textContent  = s.stop_reason    ?? '—';

  const archEl  = document.getElementById('iArch');
  const quantEl = document.getElementById('iQuant');
  const ctxEl   = document.getElementById('iCtx');
  const stopEl  = document.getElementById('iStop');
  [archEl, quantEl, ctxEl].forEach(el => {
    el.classList.toggle('lit', el.textContent !== '—');
  });
}

function setSendLoading(loading) {
  document.getElementById('sendBtn').disabled = loading;
  document.getElementById('sendIcon').classList.toggle('hidden', loading);
  document.getElementById('sendSpinner').classList.toggle('hidden', !loading);
}

// ── Init ──
window.addEventListener('load', fetchModels);
</script>
