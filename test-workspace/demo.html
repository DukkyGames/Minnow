<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      max-width: 480px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #7dd3fc; }
    #output {
      margin-top: 24px;
      padding: 16px;
      background: #0f172a;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.9rem;
      color: #a5f3fc;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, Demo!</h1>
    <p>This is a sample page inside the test-workspace folder. Click the button to see it in action.</p>
    <button id="click-me">Click Me</button>
    <div id="output"></div>
  </div>
  <script>
    document.getElementById('click-me').addEventListener('click', () => {
      const now = new Date().toLocaleTimeString();
      document.getElementById('output').textContent = 'Clicked at ' + now;
    });
  </script>
</body>
</html>
