name: board nightly reliability

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: board-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  board-reliability:
    name: persisted + restart + soak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      MINNOW_HOME: ${{ runner.temp }}/minnow-board-gates
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Persisted real-git scenarios
        id: persisted
        continue-on-error: true
        run: npm run board:persisted

      - name: Restart checkpoint matrix
        id: restart
        if: always()
        continue-on-error: true
        run: npm run board:restart

      - name: Deterministic 100x soaks
        id: soak
        if: always()
        continue-on-error: true
        run: npm run board:soak -- --scenario happy.quick --scenario report.builder-missing-recover --iterations 100 --seed 513

      - name: Aggregate board gate metrics
        id: metrics
        if: always()
        continue-on-error: true
        run: npm run board:gate-metrics -- --output "${{ runner.temp }}/board-gate-metrics.json" --fail-on-unexpected

      - name: Upload board gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-gates-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/minnow-board-gates/logs/orchestrate-scenarios
            ${{ runner.temp }}/board-gate-metrics.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce every nightly gate
        if: always() && (steps.persisted.outcome != 'success' || steps.restart.outcome != 'success' || steps.soak.outcome != 'success' || steps.metrics.outcome != 'success')
        run: node -e "process.exit(1)"
