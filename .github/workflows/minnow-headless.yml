# Optional CI smoke for headless CLI (mock-friendly unit tests run in npm test).
# Live LM Studio job can be added with continue-on-error when a provider service is available.
name: Minnow headless

on:
  workflow_dispatch:
  push:
    paths:
      - 'bin/**'
      - 'src/headless/**'
      - 'test/headless/**'
      - 'server.js'

jobs:
  headless-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --experimental-test-module-mocks ./node_modules/tsx/dist/cli.mjs --import ./test/test-loader.mjs --test test/headless/*.test.mts

