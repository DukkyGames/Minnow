# Required CI gate for pull requests and main (MIN-383).
# Enable branch protection: Settings → Branches → main → require status check "ci".
name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck + tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test discovery coverage
        run: npm run test:check-coverage

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test suite
        run: npm test

      - name: Impeccable detect
        run: npm run impeccable:detect
