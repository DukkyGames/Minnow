# Required CI gate for pull requests and main (MIN-383).
# Enable branch protection: Settings → Branches → main → require status check "ci".
name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  board-scenario-contract:
    name: board scenario contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deterministic board scenario contracts
        run: npm run board:scenario-contract

  performance-budgets:
    name: performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Bundle size budgets
        run: npm run check:performance-budgets

  gate:
    name: typecheck + tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test discovery coverage
        run: npm run test:check-coverage

      - name: Verify Uicons registry
        run: npm run check:icons

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test suite
        run: npm test
