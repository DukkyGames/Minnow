# Board release — scenario contract after package (MIN-716)

# V1 Electron AFK smoke (`board:electron-smoke`) drove `runChatTurn` against the
# deleted renderer engine. V2 packed-app coverage is the same journal suite as
# CI plus the catalog contract that Settings → Board testing still ships.

name: board release smoke

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: board-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scenario-contract:
    name: packaged catalog contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate board scenario catalog
        run: npm run board:scenario-contract
