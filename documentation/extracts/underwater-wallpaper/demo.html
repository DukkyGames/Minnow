<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minnow Underwater Wallpaper — Demo</title>
    <link rel="stylesheet" href="underwater-wallpaper.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }

      #wall {
        position: fixed;
        inset: 0;
      }

      .demo-label {
        position: fixed;
        left: 50%;
        bottom: 2rem;
        transform: translateX(-50%);
        z-index: 2;
        padding: 0.5rem 1rem;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        color: #dfe3e8;
        font-size: 0.875rem;
        letter-spacing: 0.02em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="wall" aria-hidden="true"></div>
    <p class="demo-label">Minnow — Underwater wallpaper</p>
    <script type="module">
      import { renderUnderwaterWallpaper } from './underwater-wallpaper.js';
      renderUnderwaterWallpaper(document.getElementById('wall'));
    </script>
  </body>
</html>
